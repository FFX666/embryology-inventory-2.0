name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # 网页端操作没有 package-lock.json，因此不能开启 cache: 'npm'

      # 这一步非常关键：激活 Windows 上的 MSVC 编译环境，解决 better-sqlite3 的 node-gyp 编译报错
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies
        # 使用 --legacy-peer-deps 避免没有 lock 文件时的依赖冲突
        # 移除 npm_config_build_from_source，让它尽量用预编译包，然后再由 electron-builder 处理
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build renderer
        run: npm run build

      - name: Build Electron app (Windows)
        # 打包成 .exe
        run: npx electron-builder --win --publish never

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: embryology-inventory-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: warn

      - name: Upload to Release (仅 tag 触发)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
