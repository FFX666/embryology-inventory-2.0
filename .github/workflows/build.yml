name: Build Windows Installer

on:
  # 只有当你在 GitHub 页面上点击 "Publish release"（发布新版本）时才触发
  release:
    types: [published]
  # 保留手动触发，方便在网页端修改代码后手动测试，如果不需要可以删掉下面这行
  workflow_dispatch:

# 必须加上这一行，赋予 GITHUB_TOKEN 创建和更新 Release 的权限
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # 网页端操作没有 package-lock.json，因此不能开启 cache: 'npm'

      # 激活 Windows 上的 MSVC 编译环境，解决 better-sqlite3 的 node-gyp 编译报错
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build renderer
        run: npm run build

      - name: Build Electron app (Windows)
        run: npx electron-builder --win --publish never

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: embryology-inventory-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: warn

      # 只要触发了这个 workflow，说明必定是发布了新 Release，直接上传文件
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
